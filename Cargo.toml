[package]
name = "tapo_core"
version = "0.1.0"
edition = "2024"
description = "Local (cloud-free) control of Tapo bulbs over the TPAP protocol: Rust library, CLI, HTTP server and C ABI"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/sergiusdevs/tapo_core"
keywords = ["tapo", "tp-link", "smart-home", "tpap", "spake2"]
categories = ["api-bindings", "network-programming"]
rust-version = "1.88"

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
aes = "0.9.3"
base64 = "0.23.1"
ccm = "0.6.1"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
md-5 = "0.11.0"
p256 = { version = "0.14.0", default-features = false, features = ["arithmetic"] }
pbkdf2 = "0.13.0"
rand = "0.10.3"
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.0"
tiny_http = "0.12.0"
zeroize = "1.9.1"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
